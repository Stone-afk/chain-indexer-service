services:
  postgres:
    image: postgres:14.14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chain_indexer_e2e
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer_e2e"]
      interval: 1s
      timeout: 3s
      retries: 30
